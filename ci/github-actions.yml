name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependency
        run: python -m pip install openpyxl
      - name: Check Python syntax and display name
        run: |
          python -c "import ast,pathlib; files=pathlib.Path('.').rglob('*.py'); [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in files]"
          python -c "from pathlib import Path; assert 'name: 合同管理大师' in Path('SKILL.md').read_text(encoding='utf-8')"
      - name: Run regression tests
        run: python -m unittest discover tests -v
